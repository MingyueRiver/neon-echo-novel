<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹回响：零号协议 | Neon Echo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff003c;
            --bg-dark: #050505;
            --panel-bg: rgba(10, 15, 20, 0.90);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            animation: scanlineMove 0.8s linear infinite;
        }
        
        .scanlines::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        /* Animations */
        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 60% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translate(1px, -1px); }
        }

        /* UI Elements */
        .terminal-box {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(4px);
            position: relative;
        }

        .terminal-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-blue), transparent, var(--neon-pink));
            z-index: -1;
            opacity: 0.3;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cyber-btn:hover:not(:disabled) {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .cyber-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .cyber-btn:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .cyber-btn.danger {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .cyber-btn.danger:hover:not(:disabled) {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }
        
        .cyber-btn.special {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        .cyber-btn.special:hover:not(:disabled) {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .glitch-text {
            position: relative;
        }
        
        .glitch-text:hover::before {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            text-shadow: -1px 0 var(--neon-pink);
            background: var(--bg-dark);
            overflow: hidden;
            clip-path: inset(0 0 0 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 2px;
        }

        /* Typing Cursor */
        .cursor::after {
            content: '█';
            animation: blink 1s infinite;
            margin-left: 4px;
            color: var(--neon-green);
        }
        @keyframes blink { 50% { opacity: 0; } }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .stat-bar-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .inventory-item {
            border-left: 2px solid var(--neon-green);
            padding-left: 8px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="flex flex-col h-screen text-sm md:text-base selection:bg-cyan-500 selection:text-black">

            </div>

        <aside class="w-full md:w-72 terminal-box p-5 flex flex-col gap-4 shrink-0 h-auto md:h-auto min-h-[150px]">

                <h3 class="border-b border-gray-700 pb-2 text-green-400 font-bold tracking-widest text-xs mb-3">INVENTORY // 物品栏</h3>

    </main>

    <!-- Control Panel -->
    <footer class="p-4 bg-black/95 border-t border-cyan-900 z-20 shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.8)]">

    <!-- Audio toggle -->

    </div>

    <script>
        /**
         * AUDIO ENGINE
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;

        const SoundFX = {
            playTone: (freq, type, duration, vol = 0.1) => {
                if (isMuted) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            
            typeChar: () => {
                // High pitched random blip for typing
                if(Math.random() > 0.7) return; // Don't beep every char
                const freq = 800 + Math.random() * 200;
                SoundFX.playTone(freq, 'square', 0.03, 0.015);
            },
            
            hover: () => {
                SoundFX.playTone(200, 'sine', 0.1, 0.03);
            },
            
            click: () => {
                SoundFX.playTone(600, 'sawtooth', 0.1, 0.08);
                setTimeout(() => SoundFX.playTone(300, 'square', 0.2, 0.05), 80);
            },
            
            glitch: () => {
                for(let i=0; i<6; i++) {
                    setTimeout(() => {
                        SoundFX.playTone(100 + Math.random()*800, 'sawtooth', 0.05, 0.08);
                    }, i * 40);
                }
            },

            loot: () => {
                 SoundFX.playTone(1200, 'sine', 0.1, 0.1);
                 setTimeout(() => SoundFX.playTone(1800, 'sine', 0.3, 0.1), 100);
            },

            danger: () => {
                 SoundFX.playTone(100, 'sawtooth', 0.5, 0.2);
            }
        };

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            isMuted = !isMuted;
            e.target.innerText = isMuted ? "AUDIO: OFF" : "AUDIO: ON";
        });

        /**
         * GAME STATE
         */
        const gameState = {
            hp: 100,
            san: 100,
            inventory: [],
            flags: {},
            currentScene: null
        };

                    "『静默』酒吧并不安静。舞池里扭动着各种改装过的人体。",
                    "吧台后面，一个全息投影酒保正在擦拭杯子。",
                    "角落里坐着一个戴着兜帽的人，那是『瑞文』，第4区最好的解密专家。"
                ],
                location: "第4区 / 静默酒吧",
                choices: [
                    { text: "与瑞文交谈", next: "talk_raven" },
                    { text: "在吧台点一杯『神经阻断剂』", next: "drink_bar", effect: "san+20" }
                ]
            },
            "drink_bar": {
                text: ["蓝色的液体顺喉而下，你的焦虑感减轻了，但思维也变得迟缓。"],
                choices: [{text: "去找瑞文", next: "talk_raven"}]
            },
            "talk_raven": {
                text: [
                    "瑞文抬起头，露出一双义眼：“我闻到了麻烦的味道，还有值钱的数据味。”",
                    "你拿出了数据盘。",
                    "瑞文：“这就是传说中的『零号协议』？如果我解开它，整个新九州的防火墙都会崩溃。你确定要这么做？”"
                ],
                choices: [
                    { text: "把盘给他解密", next: "decrypt_choice" },
                    { text: "这太危险了，我需要更多准备", next: "leave_bar" }
                ]
            },
            "decrypt_choice": {
                text: [
                    "瑞文接过数据盘，手指接入终端。几分钟后，他的表情凝固了。",
                    "“这...这不是病毒，也不是武器蓝图。”",
                    "“这是一份记忆备份。主角是你。”",
                    "“你是世界树公司的原型机，零号。你不是人类。”"
                ],
                choices: [
                    { text: "难以置信 (SAN崩坏)", next: "ending_insanity", effect: "san-100", type: "danger" },
                    { text: "接受真相并觉醒", next: "ending_awakening", req: { stat: "san", val: 50 }, type: "special" },
                    { text: "否认现实，摧毁数据盘", next: "ending_denial" }
                ]
            },
            "clinic": {
                text: [
                    "黑诊所里弥漫着消毒水和腐烂血肉的味道。",
                    "老维医生一边抽着合成烟草，一边看着你。",
                    "“看起来你经历了一场恶战。我有办法修好你，但我想要那个数据盘作为报酬。”"
                ],
                location: "第4区 / 黑诊所",
                choices: [
                    { text: "同意交易 (失去数据盘)", next: "ending_survival", effect: "hp+100" },
                    { text: "拒绝，武力威胁他治疗", next: "threaten_doc", req: { item: "EMP手雷" } },
                    { text: "离开诊所", next: "main_street" }
                ]
            },
            "threaten_doc": {
                text: [
                    "你拿出了EMP手雷，老维的脸色变了。",
                    "“好吧，疯子。坐下，我给你治疗。”",
                    "他在恐惧中为你修复了伤口。"
                ],
                choices: [{text: "身体恢复，前往公司复仇", next: "assault_corp", effect: "hp+50"}]
            },
            "assault_corp": {
                text: [
                    "你来到了世界树公司的大楼下。",
                    "既然知道了这是一场阴谋，唯一的出路就是杀上去。",
                    "你握紧了拳头，义肢轰鸣。"
                ],
                choices: [
                    { text: "如果拥有密钥，潜入系统", next: "ending_ascension", req: { item: "世界树后门密钥" }, type: "special" },
                    { text: "正面突击", next: "ending_cyberpsycho", type: "danger" }
                ]
            },
            // ENDINGS
            "ending_insanity": {
                text: [
                    "“我是... 机器？”",
                    "逻辑回路过载。现实与虚幻的界限崩塌。",
                    "你开始大笑，然后在大街上疯狂地攻击看到的每一个影子。",
                    "最后，暴恐机动队终结了你的痛苦。",
                    "【结局：赛博精神病】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "ending_denial": {
                text: [
                    "你一把夺过数据盘，将它捏得粉碎。",
                    "“我是人类。我有痛觉，我有记忆。”",
                    "你离开了酒吧，消失在雨夜中，继续做一个底层的雇佣兵。",
                    "真相被永远掩埋。",
                    "【结局：缸中之脑的迷梦】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "ending_survival": {
                text: [
                    "你交出了数据盘。老维修好了你的身体。",
                    "没有了那些麻烦的数据，你感到前所未有的轻松。",
                    "你活下来了，但也失去了寻找自我的机会。",
                    "【结局：苟活】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "ending_awakening": {
                text: [
                    "你看着自己的双手，接受了这个事实。",
                    "既然是机器，那就意味着没有极限。",
                    "你解除了大脑的安全限制器。",
                    "你不再是第4区的一个混混，你是网络的神。",
                    "你转身离开，准备接管这个城市。",
                    "【结局：机械降神】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "ending_cyberpsycho": {
                text: [
                    "你杀穿了一楼大厅，但面对公司精锐的机甲部队，你的血肉之躯终究到了极限。",
                    "在最后的时刻，你引爆了体内的核心。",
                    "巨大的爆炸吞噬了一切。",
                    "【结局：壮烈的烟火】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "ending_ascension": {
                text: [
                    "利用后门密钥，你避开了物理防御，直接接入了公司的主机。",
                    "你将自己的意识上传到了云端。",
                    "肉体倒在椅子上，但你的精神已经遍布网络的每一个角落。",
                    "你看着底下渺小的人类，成为了新的监管者。",
                    "【真结局：数字永生】"
                ],
                choices: [{ text: "重启系统", next: "restart" }]
            },
            "generic_end": {
                text: [
                    "信号丢失...",
                    "你的故事在这里戛然而止。",
                ],
                choices: [
                    { text: "系统重启", next: "start" }
                ]
            }
        };

        const handler = {
            get: (target, name) => target[name] || {
                text: ["数据扇区损坏...", "无法读取该节点的记忆。"],
                choices: [{ text: "返回起点", next: "start" }]
            }
        };
        const safeStory = new Proxy(story, handler);

        /**
         * UI ENGINE
         */
        const ui = {
            log: document.getElementById('story-log'),
            choices: document.getElementById('choices-container'),
            hpVal: document.getElementById('hp-val'),
            hpBar: document.getElementById('hp-bar'),
            sanVal: document.getElementById('san-val'),
            sanBar: document.getElementById('san-bar'),
            invList: document.getElementById('inventory-list'),
            locText: document.getElementById('location-text'),
            anchor: document.getElementById('scroll-anchor'),

            updateStats: () => {
                ui.hpVal.innerText = `${gameState.hp}%`;
                ui.hpBar.style.width = `${gameState.hp}%`;
                ui.hpBar.className = `h-full stat-bar-fill ${gameState.hp < 30 ? 'bg-red-600 shadow-[0_0_10px_#ff0000]' : 'bg-pink-500 shadow-[0_0_8px_#ff00ff]'}`;

                ui.sanVal.innerText = `${gameState.san}%`;
                ui.sanBar.style.width = `${gameState.san}%`;
                
                // Low stat visual glitch effects
                if (gameState.san < 30) {
                    document.body.style.filter = "hue-rotate(90deg) contrast(1.2)";
                } else {
                    document.body.style.filter = "none";
                }
            },

            updateInventory: () => {
                ui.invList.innerHTML = '';
                if (gameState.inventory.length === 0) {
                    ui.invList.innerHTML = '<li class="italic opacity-50 pl-2">-- 空 --</li>';
                    return;
                }
                gameState.inventory.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "inventory-item text-cyan-100";
                    li.innerText = item;
                    ui.invList.appendChild(li);
                });
            },

            addLogEntry: (text, isSystem = false) => {
                const p = document.createElement('div');
                p.className = isSystem 
                    ? "text-xs text-green-400 font-mono mb-2 border-l-2 border-green-500 pl-2 opacity-90 tracking-wide" 
                    : "mb-4 leading-relaxed text-gray-100 text-base md:text-lg shadow-black drop-shadow-md font-light";
                
                if(!isSystem) p.classList.add('cursor');
                
                ui.log.appendChild(p);
                ui.scrollToBottom();
                return p;
            },

            scrollToBottom: () => {
                requestAnimationFrame(() => {
                    ui.anchor.scrollIntoView({ behavior: "smooth", block: "end" });
                });
            },

            clearChoices: () => {
                ui.choices.innerHTML = '';
            },

            createButton: (choice) => {
                const btn = document.createElement('button');
                let baseClass = `cyber-btn p-4 w-full text-left md:text-center font-bold text-sm md:text-base group`;
                if (choice.type === 'danger') baseClass += ' danger';
                if (choice.type === 'special') baseClass += ' special';
                
                btn.className = baseClass;
                
                // Prepare Button Content
                let btnContent = `<span>${choice.text}</span>`;
                if (choice.loot) {
                    btnContent += `<span class="text-xs ml-2 text-yellow-300 border border-yellow-300 px-1 rounded">[获: ${choice.loot}]</span>`;
                }
                btnContent += `<span class="float-right md:float-none md:ml-2 opacity-50 group-hover:translate-x-1 transition-transform">&gt;&gt;</span>`;
                
                btn.innerHTML = btnContent;
                
                // Logic Check
                let locked = false;
                let lockMsg = "";

                // Check Stat Requirement
                if (choice.req && choice.req.stat) {
                    const val = gameState[choice.req.stat];
                    if (val < choice.req.val) {
                        locked = true;
                        lockMsg = `${choice.req.stat.toUpperCase()} 需要 ${choice.req.val}`;
                    }
                }
                
                // Check Item Requirement
                if (choice.req && choice.req.item) {
                    if (!gameState.inventory.includes(choice.req.item)) {
                        locked = true;
                        lockMsg = `需要物品: [${choice.req.item}]`;
                    }
                }

                if (locked) {
                    btn.disabled = true;
                    btn.innerHTML = `<div class="flex flex-col items-start md:items-center w-full"><span class="opacity-50 line-through">${choice.text}</span><span class="text-xs text-red-500 mt-1">🔒 ${lockMsg}</span></div>`;
                } else {
                    btn.addEventListener('mouseenter', SoundFX.hover);
                    btn.addEventListener('click', () => {
                        SoundFX.click();
                        game.makeChoice(choice);
                    });
                }

                ui.choices.appendChild(btn);
            }
        };

        /**
         * MAIN LOGIC
         */
        const game = {
            isTyping: false,
            typingSpeed: 25,

            init: () => {
                document.getElementById('start-btn').addEventListener('click', () => {
                    SoundFX.click();
                    game.start();
                });
                
                bgAnimation.init();
            },

            start: () => {
                gameState.hp = 100;
                gameState.san = 100;
                gameState.inventory = [];
                gameState.flags = {};
                ui.log.innerHTML = '';
                ui.updateStats();
                ui.updateInventory();
                game.loadScene('start');
            },

            loadScene: async (sceneId) => {
                if (sceneId === 'restart') {
                    game.start();
                    return;
                }

                gameState.currentScene = sceneId;
                const scene = safeStory[sceneId];
                
                // Location Update Effect
                if(scene.location) {
                    ui.locText.innerText = scene.location;
                    ui.locText.classList.remove('animate-pulse');
                    void ui.locText.offsetWidth;
                    ui.locText.classList.add('animate-pulse');
                }

                ui.clearChoices();

                // Typing
                for (let line of scene.text) {
                    await game.typeText(line);
                    await new Promise(r => setTimeout(r, 400));
                }

                // Render Choices
                if (scene.choices) {
                    scene.choices.forEach(ui.createButton);
                } else {
                    ui.createButton({ text: "系统连接中断... 重试", next: "start" });
                }
            },

            typeText: (text) => {
                return new Promise((resolve) => {
                    // Check for system messages
                    const isSystem = text.startsWith("系统") || text.startsWith("警告") || text.startsWith("获得") || text.startsWith("【");
                    const p = ui.addLogEntry("", isSystem);
                    
                    if(isSystem && (text.includes("警告") || text.includes("失败"))) SoundFX.danger();
                    
                    let i = 0;
                    game.isTyping = true;

                    function type() {
                        if (i < text.length) {
                            p.textContent += text.charAt(i);
                            i++;
                            if (i % 2 === 0) SoundFX.typeChar(); 
                            setTimeout(type, game.typingSpeed);
                            ui.scrollToBottom();
                        } else {
                            game.isTyping = false;
                            p.classList.remove('cursor');
                            resolve();
                        }
                    }
                    type();
                });
            },

            makeChoice: (choice) => {
                if (game.isTyping) return;

                // 1. Stats Effect
                if (choice.effect) {
                    if (choice.effect.includes('hp+')) gameState.hp = Math.min(100, gameState.hp + parseInt(choice.effect.split('+')[1]));
                    if (choice.effect.includes('hp-')) gameState.hp = Math.max(0, gameState.hp - parseInt(choice.effect.split('-')[1]));
                    if (choice.effect.includes('san+')) gameState.san = Math.min(100, gameState.san + parseInt(choice.effect.split('+')[1]));
                    if (choice.effect.includes('san-')) gameState.san = Math.max(0, gameState.san - parseInt(choice.effect.split('-')[1]));
                    
                    // Damage Effect
                    if(choice.effect.includes('hp-') || choice.effect.includes('san-')) {
                        SoundFX.glitch();
                        document.body.style.animation = "glitch-anim-1 0.3s";
                        setTimeout(() => document.body.style.animation = "", 300);
                    }
                    ui.updateStats();
                }
                
                // 2. Loot Effect
                if (choice.loot) {
                    if (!gameState.inventory.includes(choice.loot)) {
                        gameState.inventory.push(choice.loot);
                        SoundFX.loot();
                        ui.updateInventory();
                        // Add a small log for item gain
                        setTimeout(() => ui.addLogEntry(`系统提示：已将 [${choice.loot}] 添加到物品栏。`, true), 100);
                    }
                }

                // 3. Flags
                if (choice.setFlag) {
                    gameState.flags[choice.setFlag] = true;
                }

                // 4. Log Choice
                const choiceLog = document.createElement('div');
                choiceLog.className = "text-right text-cyan-600 italic text-sm mb-4 border-r-2 border-cyan-800 pr-2 opacity-70";
                choiceLog.innerText = `>> 选择: ${choice.text}`;
                ui.log.appendChild(choiceLog);

                // 5. Check Death
                if (gameState.hp <= 0) {
                     game.loadScene('generic_end'); // Or a specific death scene
                     setTimeout(() => ui.addLogEntry("生命体征停止。系统强制离线。", true), 500);
                     return;
                }

                game.loadScene(choice.next || 'generic_end');
            }
        };

        /**
         * BACKGROUND
         */
        const bgAnimation = {
            init: () => {
                const canvas = document.getElementById('canvas-bg');
                const ctx = canvas.getContext('2d');
                let width, height;

                const resize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                let offset = 0;

                function draw() {
                    ctx.fillStyle = '#050505';
                    ctx.fillRect(0, 0, width, height);

                    const horizon = height * 0.45;
                    
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
                    ctx.lineWidth = 1;

                    // Vertical
                    for (let x = -width; x < width * 2; x += 60) {
                        ctx.moveTo(x, height);
                        const progress = (x - width/2) / (width);
                        ctx.lineTo(width/2 + progress * 20, horizon);
                    }

                    // Horizontal
                    offset = (offset + 0.2) % 40;
                    for (let y = 0; y < height - horizon; y += 20) {
                        let py = height - y + offset * (y/height * 2); 
                        if (py > horizon) {
                            ctx.moveTo(0, py);
                            ctx.lineTo(width, py);
                        }
                    }
                    ctx.stroke();
                    
                    // Sun / Moon / City Light
                    const gradient = ctx.createRadialGradient(width/2, horizon, 10, width/2, horizon, 300);
                    gradient.addColorStop(0, 'rgba(255, 0, 255, 0.2)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);

                    requestAnimationFrame(draw);
                }
                draw();
            }
        };

        window.onload = game.init;

    </script>
</body>
